name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install npm dependencies
        run: npm ci

      - name: 6. Install Capacitor Android Platform
        run: |
          npx cap add android --confirm || echo "Android platform sudah ada"

      - name: 7. Copy web files to Capacitor
        run: npx cap sync android

      - name: 8. Give permission to gradlew
        run: chmod +x android/gradlew

      - name: 9. Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 10. Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Data-Monitor-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
